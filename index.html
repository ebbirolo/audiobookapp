<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <h1>Audiobook App <button id="dark-mode-toggle" class="dark-mode-toggle">🌙</button></h1>
        <div class="controls">
            <textarea id="text-input" placeholder="Paste text here or load a file..." rows="6"></textarea>
            <div class="button-group">
                <input type="file" id="file-input" accept=".txt">
                <button id="load-file">Load File</button>
            </div>
            <div class="button-group">
                <button id="play-btn">Play</button>
                <button id="pause-btn">Pause</button>
                <button id="stop-btn">Stop</button>
            </div>
            <div class="settings">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
                <label for="rate">Rate:</label>
                <input type="range" id="rate" min="0.1" max="2" step="0.1" value="1">
                <label for="pitch">Pitch:</label>
                <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
            </div>
            <div id="status"></div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
